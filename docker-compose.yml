services:
  pera_tv_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pera_tv_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    expose:
      - "8000"
    environment:
      - PORT=8000
      - TMDB_API_KEY=${TMDB_API_KEY:-0be70a0df8da0d4df674178ecb774db1}
      - IPTV_URL=${IPTV_URL:-http://149.78.186.18}
      - IPTV_USERNAME=${IPTV_USERNAME:-57430164}
      - IPTV_PASSWORD=${IPTV_PASSWORD:-22727897}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - default
      - easypanel

networks:
  easypanel:
    external: true
